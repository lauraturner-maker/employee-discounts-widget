<style>
    :root {
        --primary: var(--sb-brand, #2563eb);
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --text: #1f2937;
        --text-light: #6b7280;
        --bg: #ffffff;
        --bg-gray: #f9fafb;
        --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --primary: var(--sb-brand, #3b9eff);
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --text: #f3f4f6;
            --text-light: #9ca3af;
            --bg: #1f2937;
            --bg-gray: #111827;
            --border: #374151;
        }
    }

    * { box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
    }

    .widget {
        width: 100%;
        max-width: 980px;
        margin: 0 auto;
        background: var(--bg);
        border-radius: 14px;
        padding: 20px;
    }

    .cw-header {
        text-align: center;
        margin-bottom: 18px;
    }

    .cw-header h2 {
        margin: 0 0 6px 0;
        font-size: 22px;
        letter-spacing: -0.01em;
    }

    .cw-header p {
        margin: 0;
        color: var(--text-light);
        font-size: 14px;
    }

    .cw-sync-note {
        text-align: center;
        font-size: 11.5px;
        color: var(--text-light);
        margin: 4px 0 0 0;
    }

    .cw-controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 16px;
        position: sticky;
        top: 0;
        background: var(--bg);
        padding: 6px 0;
        z-index: 5;
    }

    .cw-search-wrap {
        position: relative;
    }

    .cw-search-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-light);
        pointer-events: none;
        font-size: 14px;
    }

    .cw-search {
        width: 100%;
        padding: 10px 12px 10px 34px;
        font-size: 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg-gray);
        color: var(--text);
        font-family: inherit;
    }

    .cw-search:focus {
        outline: 2px solid var(--primary);
        outline-offset: 1px;
    }

    .cw-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }

    .cw-tab {
        padding: 6px 12px;
        font-size: 13px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg-gray);
        color: var(--text);
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }

    .cw-tab:hover { filter: brightness(0.96); }

    .cw-tab.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
    }

    .cw-count {
        font-size: 12px;
        color: var(--text-light);
        margin-bottom: 10px;
    }

    .cw-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 14px;
    }

    .discount-card {
        border: 1px solid var(--border);
        background: var(--bg-gray);
        border-radius: 12px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        cursor: pointer;
        text-align: left;
        font-family: inherit;
        color: inherit;
    }

    .discount-card:hover {
        border-color: var(--primary);
    }

    .discount-card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
    }

    .discount-icon {
        font-size: 20px;
        line-height: 1;
    }

    .discount-badge {
        font-size: 11px;
        font-weight: 700;
        color: var(--success);
        background: color-mix(in srgb, var(--success) 16%, transparent);
        border-radius: 6px;
        padding: 3px 7px;
        white-space: nowrap;
    }

    .discount-name {
        font-size: 15px;
        font-weight: 700;
        margin: 0;
    }

    .discount-category {
        font-size: 11px;
        font-weight: 600;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.02em;
    }

    .discount-address {
        font-size: 12.5px;
        color: var(--text-light);
        display: flex;
        gap: 5px;
        align-items: flex-start;
    }

    .discount-blurb {
        font-size: 13px;
        color: var(--text);
        margin: 0;
        line-height: 1.4;
    }

    .discount-more {
        margin-top: auto;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--primary);
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .cw-empty {
        text-align: center;
        color: var(--text-light);
        font-size: 14px;
        padding: 40px 16px;
    }

    /* Modal */
    .cw-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 50;
    }

    .cw-modal-overlay.open { display: flex; }

    .cw-modal {
        background: var(--bg);
        border-radius: 14px;
        max-width: 440px;
        width: 100%;
        max-height: 85vh;
        overflow-y: auto;
        padding: 20px;
        border: 1px solid var(--border);
    }

    .cw-modal-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 4px;
    }

    .cw-modal-close {
        background: var(--bg-gray);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        width: 30px;
        height: 30px;
        font-size: 16px;
        cursor: pointer;
        flex-shrink: 0;
    }

    .cw-modal h3 {
        margin: 0 0 2px 0;
        font-size: 18px;
    }

    .cw-modal-badge {
        display: inline-block;
        font-size: 13px;
        font-weight: 700;
        color: var(--success);
        background: color-mix(in srgb, var(--success) 16%, transparent);
        border-radius: 8px;
        padding: 5px 10px;
        margin: 10px 0;
    }

    .cw-modal-section {
        margin-top: 14px;
    }

    .cw-modal-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--text-light);
        margin-bottom: 4px;
    }

    .cw-modal-value {
        font-size: 13.5px;
        line-height: 1.5;
        margin: 0;
    }

    @media (max-width: 480px) {
        .widget { padding: 14px; }
        .cw-grid { grid-template-columns: 1fr; }
    }
</style>
</head>

    // --- State ---
    let DISCOUNTS = SEED_DISCOUNTS;
    let activeCategory = 'all';
    let searchQuery = '';

    // Pulls the latest discount list (seed + anything created via the
    // Staffbase Forms webhook) and re-renders in place once it arrives.
    async function loadLiveDiscounts() {
        if (!CONFIG.discountsApiUrl || CONFIG.discountsApiUrl.includes('REPLACE_WITH')) {
            console.warn('Employee Discounts widget: CONFIG.discountsApiUrl is not set, showing seed data only.');
            return;
        }
        try {
            const url = new URL(CONFIG.discountsApiUrl);
            if (CONFIG.formId && !CONFIG.formId.includes('REPLACE_WITH')) {
                url.searchParams.set('formId', CONFIG.formId);
            }
            const res = await fetch(url.toString());
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if (Array.isArray(data.discounts) && data.discounts.length > 0) {
                DISCOUNTS = data.discounts;
                renderAll();
            }
            if (data.warning) console.warn('Employee Discounts widget:', data.warning);
        } catch (e) {
            console.warn('Employee Discounts widget: failed to load live discounts, showing seed data.', e);
        }
    }

    function matchesFilters(item) {
        if (activeCategory !== 'all' && item.category !== activeCategory) return false;
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const hay = (item.name + ' ' + item.address + ' ' + item.blurb).toLowerCase();
            if (!hay.includes(q)) return false;
        }
        return true;
    }

    function renderTabs() {
        const wrap = document.getElementById('cw-tabs');
        wrap.innerHTML = '';
        const allTab = document.createElement('button');
        allTab.type = 'button';
        allTab.className = 'cw-tab' + (activeCategory === 'all' ? ' active' : '');
        allTab.textContent = t.catAll;
        allTab.addEventListener('click', () => { activeCategory = 'all'; renderAll(); });
        wrap.appendChild(allTab);

        CATEGORIES.forEach(cat => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cw-tab' + (activeCategory === cat.key ? ' active' : '');
            btn.innerHTML = '<span>' + cat.icon + '</span><span>' + cat.label() + '</span>';
            btn.addEventListener('click', () => { activeCategory = cat.key; renderAll(); });
            wrap.appendChild(btn);
        });
    }

    function renderGrid() {
        const grid = document.getElementById('cw-grid');
        const empty = document.getElementById('cw-empty');
        const count = document.getElementById('cw-count');
        const filtered = DISCOUNTS.filter(matchesFilters);

        count.textContent = filtered.length + ' / ' + DISCOUNTS.length;
        grid.innerHTML = '';

        if (filtered.length === 0) {
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        filtered.forEach(item => {
            const cat = CAT_BY_KEY[item.category] || CAT_BY_KEY.misc;
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'discount-card';
            card.innerHTML =
                '<div class="discount-card-top">' +
                    '<span class="discount-icon">' + cat.icon + '</span>' +
                    '<span class="discount-badge">' + item.highlight + '</span>' +
                '</div>' +
                '<div class="discount-category">' + cat.label() + '</div>' +
                '<div class="discount-name">' + item.name + '</div>' +
                '<div class="discount-address"><span>\u{1F4CD}</span><span>' + item.address + '</span></div>' +
                '<p class="discount-blurb">' + item.blurb + '</p>' +
                '<div class="discount-more">' + t.viewDetails + ' →</div>';
            card.addEventListener('click', () => openModal(item));
            grid.appendChild(card);
        });
    }

    function renderAll() {
        renderTabs();
        renderGrid();
    }

    // --- Modal ---
    function openModal(item) {
        const cat = CAT_BY_KEY[item.category] || CAT_BY_KEY.misc;
        const overlay = document.getElementById('cw-modal-overlay');
        const modal = document.getElementById('cw-modal');

        const websiteRow = item.website && item.website !== '—'
            ? '<div class="cw-modal-section"><div class="cw-modal-label">' + t.websiteLabel + '</div><p class="cw-modal-value">' + item.website + '</p></div>'
            : '';
        const phoneRow = item.phone && item.phone !== '—'
            ? '<div class="cw-modal-section"><div class="cw-modal-label">' + t.phoneLabel + '</div><p class="cw-modal-value">' + item.phone + '</p></div>'
            : '';

        modal.innerHTML =
            '<div class="cw-modal-top">' +
                '<div>' +
                    '<div class="discount-category">' + cat.icon + ' ' + cat.label() + '</div>' +
                    '<h3>' + item.name + '</h3>' +
                '</div>' +
                '<button type="button" class="cw-modal-close" id="cw-modal-close-btn" aria-label="' + t.close + '">&times;</button>' +
            '</div>' +
            '<div class="cw-modal-badge">' + item.highlight + '</div>' +
            '<div class="cw-modal-section">' +
                '<div class="cw-modal-label">' + t.addressLabel + '</div>' +
                '<p class="cw-modal-value">' + item.address + '</p>' +
            '</div>' +
            phoneRow +
            websiteRow +
            '<div class="cw-modal-section">' +
                '<div class="cw-modal-label">' + t.detailsLabel + '</div>' +
                '<p class="cw-modal-value">' + (item.details || '—') + '</p>' +
            '</div>' +
            '<div class="cw-modal-section">' +
                '<div class="cw-modal-label">' + t.redeemLabel + '</div>' +
                '<p class="cw-modal-value">' + (item.redeem || '—') + '</p>' +
            '</div>';

        overlay.classList.add('open');
        document.getElementById('cw-modal-close-btn').addEventListener('click', closeModal);
    }

    function closeModal() {
        document.getElementById('cw-modal-overlay').classList.remove('open');
    }

    // --- Apply translations + init ---
    function applyTranslations() {
        applySBBrand();
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.dataset.i18n;
            if (t[key] !== undefined) el.textContent = t[key];
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.dataset.i18nPlaceholder;
            if (t[key] !== undefined) el.placeholder = t[key];
        });
    }

    function init() {
        applyTranslations();
        renderAll();
        loadLiveDiscounts();

        document.getElementById('cw-search').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderGrid();
        });

        const overlay = document.getElementById('cw-modal-overlay');
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
